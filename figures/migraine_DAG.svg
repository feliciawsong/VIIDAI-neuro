<text x="800" y="389" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Sleep loss, skipped meals</text>
<rect x="685" y="447" width="230" height="54" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="800" y="479" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Chemical odors</text>
