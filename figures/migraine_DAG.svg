<text x="1080" y="344" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold">Migraine</text>
<rect x="40" y="790" width="26" height="16" rx="3" fill="#FCE4C8" stroke="#C46A00" stroke-width="1.5"/>
<text x="74" y="803" font-size="13" fill="#1F1F1F">Exposure tested</text>
<rect x="212.0" y="790" width="26" height="16" rx="3" fill="#D6EFD8" stroke="#2E7D32" stroke-width="1.5"/>
<text x="246.0" y="803" font-size="13" fill="#1F1F1F">Confounder adjusted for</text>
<rect x="441.6" y="790" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="475.6" y="803" font-size="13" fill="#1F1F1F">Measured, other</text>
<rect x="613.6" y="790" width="26" height="16" rx="3" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="647.6" y="803" font-size="13" fill="#1F1F1F">Not measured</text>
<rect x="764.0" y="790" width="26" height="16" rx="3" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="798.0" y="803" font-size="13" fill="#1F1F1F">Outcome</text>
<text x="40" y="836" font-size="13" fill="#1F1F1F"><tspan font-weight="bold">Adjustment sets:</tspan> exertion/heat (heavy lifting, hot conditions) → migraine: sex + Indigenous language.  Hypertension → migraine: sex + age.</text>
<text x="40" y="858" font-size="12" fill="#5A5A5A">Arrows show assumed causal direction based on prior literature; the cross-sectional data cannot confirm direction. Dashed arrows pass through unmeasured factors.</text>
</svg>