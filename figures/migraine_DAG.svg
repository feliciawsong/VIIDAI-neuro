<text x="470" y="479" text-anchor="middle" font-size="14" fill="#1F1F1F">Pesticide exposure</text>
<rect x="355" y="647" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.4"/>
<text x="470" y="679" text-anchor="middle" font-size="14" fill="#1F1F1F">Hypertension</text>
