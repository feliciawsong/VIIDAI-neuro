<text x="470" y="200" text-anchor="middle" font-size="14" fill="#1F1F1F">Heavy lifting</text>
<text x="470" y="218" text-anchor="middle" font-size="12" fill="#1F1F1F">(part of exertion/heat score)</text>
<rect x="355" y="267" width="230" height="54" rx="8" fill="#FCE4C8" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="290" text-anchor="middle" font-size="14" fill="#1F1F1F">Hot working conditions</text>
<text x="470" y="308" text-anchor="middle" font-size="12" fill="#1F1F1F">(part of exertion/heat score)</text>
<rect x="355" y="357" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.4"/>
<text x="470" y="389" text-anchor="middle" font-size="14" fill="#1F1F1F">Long work hours</text>
