<text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1F1F">Directed acyclic graph (DAG): hypothesized pathways to neuropathic pain</text>
<text x="150" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">BACKGROUND FACTORS</text>
<text x="470" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">MEASURED EXPOSURES</text>
<text x="805" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">MECHANISMS (NOT MEASURED)</text>
<text x="1085" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">OUTCOME</text>
