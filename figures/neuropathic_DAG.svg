<text x="1085" y="692" text-anchor="middle" font-size="11" fill="#8E1B1B" font-style="italic">Reverse causation: pain may push</text>
<text x="1085" y="706" text-anchor="middle" font-size="11" fill="#8E1B1B" font-style="italic">people out of repetitive work, so</text>
<text x="1085" y="720" text-anchor="middle" font-size="11" fill="#8E1B1B" font-style="italic">it can look "protective" in our data</text>
<rect x="35" y="208" width="230" height="54" rx="8" fill="#D6EFD8" stroke="#2E7D32" stroke-width="2"/>
<text x="150" y="240" text-anchor="middle" font-size="14" fill="#1F1F1F">Age</text>
<rect x="35" y="403" width="230" height="54" rx="8" fill="#D6EFD8" stroke="#2E7D32" stroke-width="2"/>
<text x="150" y="435" text-anchor="middle" font-size="14" fill="#1F1F1F">Sex</text>
<rect x="35" y="610" width="230" height="60" rx="8" fill="#D6EFD8" stroke="#2E7D32" stroke-width="2"/>
<text x="150" y="636" text-anchor="middle" font-size="14" fill="#1F1F1F">Indigenous language</text>
<text x="150" y="654" text-anchor="middle" font-size="11.5" fill="#1F1F1F">(marker of marginalization)</text>
<rect x="355" y="123" width="230" height="54" rx="8" fill="#FCE4C8" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="155" text-anchor="middle" font-size="14" fill="#1F1F1F">Obesity / BMI</text>
<rect x="355" y="208" width="230" height="54" rx="8" fill="#FCE4C8" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="240" text-anchor="middle" font-size="14" fill="#1F1F1F">Diabetes</text>
<rect x="355" y="293" width="230" height="54" rx="8" fill="#FCE4C8" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="325" text-anchor="middle" font-size="14" fill="#1F1F1F">Hypertension</text>
<rect x="355" y="403" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="435" text-anchor="middle" font-size="14" fill="#1F1F1F">Repetitive hand movements</text>
<rect x="355" y="488" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="520" text-anchor="middle" font-size="14" fill="#1F1F1F">Heavy lifting, bending</text>
<rect x="355" y="573" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="605" text-anchor="middle" font-size="14" fill="#1F1F1F">Cold/wet conditions</text>
<rect x="355" y="658" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="690" text-anchor="middle" font-size="14" fill="#1F1F1F">Pesticide exposure</text>
<rect x="355" y="743" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/>
<text x="470" y="775" text-anchor="middle" font-size="14" fill="#1F1F1F">Alcohol use</text>
<rect x="685" y="162" width="240" height="60" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="805" y="188" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Metabolic nerve damage</text>
<text x="805" y="206" text-anchor="middle" font-size="11.5" fill="#555555" font-style="italic">(high blood sugar, inflammation)</text>
<rect x="685" y="293" width="240" height="54" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="805" y="325" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Small-vessel damage</text>
<rect x="685" y="442" width="240" height="60" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="805" y="468" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Nerve compression</text>
<text x="805" y="486" text-anchor="middle" font-size="11.5" fill="#555555" font-style="italic">(e.g., carpal tunnel)</text>
<rect x="685" y="573" width="240" height="54" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="805" y="605" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Cold-related nerve irritation</text>
<rect x="685" y="700" width="240" height="54" rx="8" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="805" y="732" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">Neurotoxicity</text>
<rect x="1000" y="443" width="170" height="54" rx="8" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/>
<text x="1085" y="475" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Neuropathic pain</text>
<rect x="1000" y="610" width="170" height="60" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="1085" y="636" text-anchor="middle" font-size="14" fill="#8E1B1B" font-style="italic">Left or reduced</text>
<text x="1085" y="654" text-anchor="middle" font-size="11.5" fill="#8E1B1B" font-style="italic">hand-intensive work</text>
<rect x="40" y="850" width="26" height="16" rx="3" fill="#FCE4C8" stroke="#C46A00" stroke-width="1.5"/>
<text x="74" y="863" font-size="13" fill="#1F1F1F">Main exposure tested</text>
<rect x="242.0" y="850" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#C46A00" stroke-width="1.5"/>
<text x="276.0" y="863" font-size="13" fill="#1F1F1F">Exploratory exposure</text>
<rect x="444.0" y="850" width="26" height="16" rx="3" fill="#D6EFD8" stroke="#2E7D32" stroke-width="1.5"/>
<text x="478.0" y="863" font-size="13" fill="#1F1F1F">Adjusted for</text>
<rect x="589.2" y="850" width="26" height="16" rx="3" fill="#F4F4F4" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="623.2" y="863" font-size="13" fill="#1F1F1F">Not measured</text>
<rect x="734.4000000000001" y="850" width="26" height="16" rx="3" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="768.4000000000001" y="863" font-size="13" fill="#1F1F1F">Outcome</text>
<rect x="844.1000000000001" y="850" width="26" height="16" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="878.1000000000001" y="863" font-size="13" fill="#1F1F1F">Reverse causation</text>
<text x="40" y="894" font-size="13" fill="#1F1F1F"><tspan font-weight="bold">Adjustment sets:</tspan> obesity/BMI: age + sex (not diabetes, which is on the pathway).  Diabetes, hypertension: age + obesity.</text>
<text x="40" y="914" font-size="13" fill="#1F1F1F">Work exposures and pesticides: age + Indigenous language.  Alcohol: age + sex.</text>
<text x="40" y="938" font-size="12" fill="#5A5A5A">Arrows show assumed causal direction based on prior literature; the cross-sectional data cannot confirm direction. Dashed arrows pass through unmeasured mechanisms.</text>
</svg>